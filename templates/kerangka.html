<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block judul %}{% endblock %} — PHYNthagoras</title>

    <!-- Aplikasi (PWA) -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#7d2027">
    <link rel="icon" type="image/png" href="static/ikon/ikon-192.png">
    <link rel="apple-touch-icon" href="static/ikon/ikon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PHYNthagoras">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="static/materi.css">
    {% block kepala %}{% endblock %}
</head>

<body {% block atribut_body %}{% endblock %}>

<!-- Navigasi atas -->
<header class="navbar">
    <div class="navbar-isi">
        <a href="./" class="logo">
            <span class="logo-ikon">△</span>
            <span><span class="logo-phyn">PHYN</span>thagoras</span>
        </a>

        <nav class="nav-link">
            <a href="beranda.html" {% if aktif == 'beranda' %}class="aktif"{% endif %}>Beranda</a>
            <a href="materi.html" {% if aktif == 'materi' %}class="aktif"{% endif %}>Materi</a>
            <a href="contoh.html" {% if aktif == 'contoh' %}class="aktif"{% endif %}>Contoh Soal</a>
            <a href="latihan.html" {% if aktif == 'latihan' %}class="aktif"{% endif %}>Latihan</a>
        </nav>
    </div>
</header>

<main>
    {% block isi_halaman %}{% endblock %}
</main>

<footer class="kaki">
    <span class="logo-phyn">PHYN</span>thagoras · Media Pembelajaran Teorema Pythagoras SMP
    <br><button type="button" class="tautan-pasang" data-pasang>⬇ Pasang aplikasi PHYNthagoras</button>
</footer>

<!-- Kertas coretan: tempat menggambar / menghitung -->
<button type="button" class="tombol-coretan" id="buka-coretan">
    ✎ <span>Coretan</span>
</button>

<div class="coretan" id="coretan" hidden>
    <div class="coretan-alat">
        <strong class="coretan-judul">✎ Kertas Coretan</strong>

        <div class="alat-grup">
            <button type="button" class="warna aktif" data-warna="#2b1d1e" style="--w:#2b1d1e" aria-label="Pena hitam"></button>
            <button type="button" class="warna" data-warna="#7d2027" style="--w:#7d2027" aria-label="Pena merah"></button>
            <button type="button" class="warna" data-warna="#2f6db5" style="--w:#2f6db5" aria-label="Pena biru"></button>
            <button type="button" class="warna" data-warna="#4f7a43" style="--w:#4f7a43" aria-label="Pena hijau"></button>
            <button type="button" class="alat" id="alat-penghapus">Penghapus</button>
            <button type="button" class="alat" id="bersihkan-coretan">Bersihkan</button>
            <button type="button" class="alat alat-tutup" id="tutup-coretan">Tutup ✕</button>
        </div>
    </div>
    <canvas id="kanvas-coretan"></canvas>
</div>

<script src="static/materi.js"></script>
<script src="static/jejak.js"></script>
<script src="static/pasang.js"></script>
{% block skrip %}{% endblock %}

</body>
</html>
